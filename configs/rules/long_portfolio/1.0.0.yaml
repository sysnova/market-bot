rule_id: long_portfolio_entry
rule_version: 1.0.0
horizon_end: "2026-12-31"
portfolio_capital_usd: 103000

# Original 10.60% cash plus the 0.60% removed from the model portfolio.
cash_weight_percent: 11.20
# SILVER 7.20%, ETH 4.07% and PALLADIUM 1.80% are reserved outside the stock feed.
reserved_weight_percent: 13.07

# Equity symbols and target weights are sourced from the local PostgreSQL watchlist
# indicator PORT_YTD. They intentionally do not live in this rule artifact.

initial_tranche_percent: 50
thresholds:
  minimum_score: 72
  minimum_confidence: 0.68
  minimum_setup_score: 68
  minimum_entry_score: 65
  minimum_trend_template_score: 75
  minimum_qualified_sessions: 2
  allowed_market_regimes: [clean_uptrend, volatile_uptrend]
  blocked_risk_flags:
    - weekly_structure_broken
    - below_weekly_200w
    - weekly_distribution
    - weekly_rsi_hot
    - extended_from_30w
    - extended_from_50w
timing:
  maximum_signal_age_hours: 72
  cooldown_days: 14
  alert_ttl_days: 5
