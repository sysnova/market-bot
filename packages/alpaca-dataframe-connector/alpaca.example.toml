[alpaca]
# Recomendado: las credenciales reales quedan en variables de entorno.
api_key_id = "${APCA_API_KEY_ID}"
api_secret_key = "${APCA_API_SECRET_KEY}"

# Use "sip" para datos consolidados (si su plan lo permite) o "iex" para acceso básico.
feed = "sip"

# "all" ajusta el histórico por splits y dividendos.
adjustment = "all"

data_base_url = "https://data.alpaca.markets"
timeout_seconds = 30.0
max_retries = 3
symbols_per_request = 100

# Límite de seguridad para consultas intradiarias extensas y paginadas.
max_pages = 1000
